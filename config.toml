[playback]
# Пауза между звуками в секундах (каждый раз выбирается случайно из диапазона)
pause_min = 30
pause_max = 120

[selection]
# Множитель шанса звука сразу после того, как он прозвучал (обычный — 1.0).
# Множитель — это относительный шанс, а не проценты: звук с множителем 0.1
# выпадает в 10 раз реже звука с множителем 1.0.
after_play = 0.1
# На сколько растёт множитель звука каждый раз, когда играет другой звук.
# Чем больше, тем быстрее «соскучившийся» звук возвращается.
growth = 0.3
# Максимальный множитель: дольше этого шанс не растёт (не меньше 1.0)
max_weight = 3.0
# Звук не может прозвучать больше max_repeats раз за последние window звуков.
# Если звуков мало, окно автоматически сужается до (число звуков − 2) × max_repeats + 1,
# чтобы на каждом шаге оставалось минимум 2 варианта и выбор не превращался в цикл.
window = 10
max_repeats = 2

[weights]
# Базовый вес отдельных звуков: относительный шанс, а не проценты. По умолчанию у всех 1.0.
# 0.5 — звук играет примерно вдвое реже, 2.0 — вдвое чаще, 0 — звук отключён.
# Имя файла пишется в кавычках (регистр букв не важен), например:
# "rare-sound.ogg" = 0.3
